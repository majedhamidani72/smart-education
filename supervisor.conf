; --------------------------------------------------------------------------
; Queue Workers (درسکا)
; --------------------------------------------------------------------------
; لیارا روی پلتفرم لاراول از قبل Supervisor نصب دارد؛ با قرار گرفتن این
; فایل در ریشه‌ی پروژه، بعد از هر Deploy این دو Worker خودکار اجرا
; می‌شوند و در صورت کرش، خودِ Supervisor دوباره راه‌اندازی‌شان می‌کند.
;
; دو صفِ جدا (به‌جای یک صفِ مشترک) عمداً استفاده شده: صف «sms» سبک و
; فوری است (OTP، اطلاع‌رسانی خرید و ...)، در حالی که صف «videos» به‌خاطر
; پردازش FFmpeg می‌تواند تا چند دقیقه طول بکشد. جدا نگه داشتنشان یعنی
; یک ویدیوی سنگین هیچ‌وقت پیامک‌های فوری را پشت خودش معطل نمی‌کند.
; --------------------------------------------------------------------------

[program:sms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=sms,default --tries=3 --timeout=60 --sleep=3
autostart=true
autorestart=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/sms-queue.log

[program:video-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work --queue=videos --tries=3 --timeout=320 --sleep=5
autostart=true
autorestart=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/html/storage/logs/video-queue.log
