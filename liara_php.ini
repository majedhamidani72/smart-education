; --------------------------------------------------------------------------
; تنظیمات اختصاصی PHP برای درسکا
; --------------------------------------------------------------------------
; پیش‌فرض PHP برای upload_max_filesize/post_max_size خیلی کوچک است (حدود
; ۲ مگابایت) و باعث شکست آپلود ویدیو/پاورپوینت/عکس می‌شود. این مقادیر را
; بزرگ‌تر می‌کنیم تا با نیاز واقعی پروژه (ویدیوهای تا ۵۰۰ مگابایت،
; طبق FileUploadService) هم‌خوان باشد.
;
; نکته: طبق مستندات لیارا، Apache پیش از رسیدن فایل به لاراول آن را در
; پوشه‌ی /tmp سرور بافر می‌کند که یک سقف سخت ۱۰۰ مگابایتی دارد — مستقل
; از این فایل. برای آپلود فایل‌های بزرگ‌تر از ۱۰۰ مگابایت، علاوه بر این
; تنظیمات، باید یک دیسک دائمی جداگانه هم به مسیر /tmp متصل شود.
; --------------------------------------------------------------------------

file_uploads = On
upload_max_filesize = 600M
post_max_size = 600M
max_execution_time = 600
max_input_time = 600
memory_limit = 512M
